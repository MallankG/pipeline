services:
  - type: web
    name: unified-etl-api
    env: docker
    dockerfilePath: ./backend/api/Dockerfile
    rootDir: ./backend/api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false


